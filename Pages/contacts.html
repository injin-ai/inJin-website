<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact | YOUR COMPANY</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="../css/style.css">

    <link
        rel="stylesheet"
        href="../css/responsive.css">

</head>


<body>


<nav class="navbar navbar-expand-lg fixed-top">

    <div class="container">

        <a
            class="navbar-brand"
            href="../index.html">

            YOUR COMPANY

        </a>


        <a
            href="../index.html"
            class="btn btn-outline-custom">

            ← Home

        </a>

    </div>

</nav>


<section
    class="section"
    style="padding-top: 170px;">

    <div class="container">

        <div class="text-center mb-5">

            <div class="section-label">
                Stay Updated
            </div>

            <h1 class="section-title">

                Be the first to

                <span class="gradient-text">
                    know.
                </span>

            </h1>

            <p class="section-description mx-auto">

                Join our early-access list and stay
                informed about our upcoming AI products.

            </p>

        </div>


        <div class="contact-card">

            <form id="earlyAccessForm">

                <div class="row g-3">


                    <div class="col-md-6">

                        <label
                            class="form-label"
                            for="name">

                            Name

                        </label>

                        <input
                            id="name"
                            type="text"
                            class="form-control"
                            placeholder="Your name"
                            required>

                    </div>


                    <div class="col-md-6">

                        <label
                            class="form-label"
                            for="email">

                            Email

                        </label>

                        <input
                            id="email"
                            type="email"
                            class="form-control"
                            placeholder="you@example.com"
                            required>

                    </div>


                    <div class="col-12">

                        <label
                            class="form-label"
                            for="interest">

                            Interested In

                        </label>

                        <select
                            id="interest"
                            class="form-control">

                            <option>
                                AI Products
                            </option>

                            <option>
                                Early Access
                            </option>

                            <option>
                                Partnership
                            </option>

                            <option>
                                Investment
                            </option>

                            <option>
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="col-12">

                        <label
                            class="form-label"
                            for="message">

                            Message

                        </label>

                        <textarea
                            id="message"
                            class="form-control"
                            rows="5"
                            placeholder="Tell us how you'd like to connect..."></textarea>

                    </div>


                    <div class="col-12">

                        <button
                            type="submit"
                            class="btn btn-primary-custom w-100">

                            Submit

                        </button>

                    </div>

                </div>

            </form>


            <div
                id="formMessage"
                class="alert alert-success mt-4 d-none">

                Thank you! Your request has been received.

            </div>

        </div>

    </div>

</section>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="../js/contact.js"></script>

</body>

</html>
